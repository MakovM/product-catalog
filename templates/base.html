<!DOCTYPE html>
<html lang="en">

<head>
  {% block title %}<title>Product Catalog</title>{% endblock %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
      integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
      crossorigin="anonymous">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
  <div class="header">
  <div class="logo">
    <p class="logo-txt">Product Catalog</p>
  </div>
  <div class="header-additional">
  </div>
  </div>
  <div class="layout">
    <div class="sidebar">
      {% block sidebar %}
        {%  include "includes/sidebar.html" %}
      {% endblock %}
    </div>

    <div class="content">
      {% block content %}
      {% endblock %}

      <br>
      {% block pagination %}
      {% endblock %}
    </div>
  </div>
</body>
</html>
