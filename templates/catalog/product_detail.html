{% extends "base.html" %}
{% block content %}
<div class="product-detail">
  <img src="{{ product.image.url }}" alt="{{ product.name }}">
  <div class="info">
  <h2>{{ product.name }}</h2>
  <p>{{ product.description }}</p>
  <p>{{ product.price }} ₴</p>
  {% if product.available %}
      <button class="add-to-cart">Add to cart</button>
  {% else %}
      <button class="out-of-stock" disabled>Not available</button>
  {% endif %}
    </div>
</div>
{% endblock %}
